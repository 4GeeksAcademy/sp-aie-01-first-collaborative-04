<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Formulario de Pago en 3 Pasos</title>
    <meta name="description" content="Formulario de pago seguro en 3 pasos con validación de datos personales, dirección y tarjeta." />
    <meta name="robots" content="index,follow" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "Formulario de pago",
        "url": "https://tudominio.com/formulario-pago"
      }
    </script>
  </head>
  <body class="min-h-screen bg-[#FFFDD0] text-slate-700 antialiased font-['Manrope']">
    <main class="relative mx-auto flex min-h-screen w-full max-w-2xl items-center justify-center p-4 sm:p-6">
      <div class="pointer-events-none absolute inset-0 overflow-hidden" aria-hidden="true">
        <div class="absolute -top-24 -right-20 h-64 w-64 rounded-full bg-[#F8C8DC]/40 blur-3xl"></div>
        <div class="absolute -bottom-20 -left-16 h-72 w-72 rounded-full bg-[#F8C8DC]/30 blur-3xl"></div>
      </div>

      <section class="relative w-full rounded-3xl border border-white/60 bg-white/75 p-5 shadow-xl backdrop-blur sm:p-8">
        <header class="mb-8">
          <p class="mb-2 text-xs font-bold uppercase tracking-[0.2em] text-slate-500">Compra segura</p>
          <h1 class="text-2xl font-extrabold tracking-tight sm:text-3xl">Formulario de pago</h1>
        </header>

        <ol class="mb-8 grid grid-cols-3 gap-2" aria-label="Progreso del formulario">
          <li class="step-item" data-step-indicator="1">
            <div class="flex items-center gap-2">
              <span class="step-dot flex h-9 w-9 items-center justify-center rounded-full border-2 text-sm font-bold transition-all duration-300">1</span>
              <span class="hidden h-0.5 flex-1 rounded-full bg-slate-300/70 sm:block"></span>
            </div>
            <p class="mt-2 text-xs font-semibold">Datos</p>
          </li>
          <li class="step-item" data-step-indicator="2">
            <div class="flex items-center gap-2">
              <span class="step-dot flex h-9 w-9 items-center justify-center rounded-full border-2 text-sm font-bold transition-all duration-300">2</span>
              <span class="hidden h-0.5 flex-1 rounded-full bg-slate-300/70 sm:block"></span>
            </div>
            <p class="mt-2 text-xs font-semibold">Dirección</p>
          </li>
          <li class="step-item" data-step-indicator="3">
            <div class="flex items-center gap-2">
              <span class="step-dot flex h-9 w-9 items-center justify-center rounded-full border-2 text-sm font-bold transition-all duration-300">3</span>
            </div>
            <p class="mt-2 text-xs font-semibold">Pago</p>
          </li>
        </ol>

        <form id="paymentForm" class="space-y-6" novalidate>
          <section class="step-panel overflow-hidden transition-all duration-300 ease-out" data-step-panel="1" aria-label="Paso 1: Datos personales">
            <h2 class="mb-4 text-lg font-bold">Paso 1: Datos personales</h2>
            <div class="space-y-4">
              <div>
                <label for="fullName" class="mb-2 block text-sm font-semibold">Nombre completo</label>
                <input
                  id="fullName"
                  name="fullName"
                  type="text"
                  required
                  minlength="2"
                  pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,}(\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,}){2,}$"
                  autocomplete="name"
                  aria-describedby="fullNameError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Ej. Ana García López"
                />
                <p id="fullNameError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label id="phoneLabel" for="phoneLocal" class="mb-2 block text-sm font-semibold">Teléfono</label>
                <div class="grid gap-2 sm:grid-cols-[130px_1fr]" role="group" aria-labelledby="phoneLabel">
                  <div>
                    <label for="countryCode" class="sr-only">País</label>
                    <select
                      id="countryCode"
                      name="countryCode"
                      class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-3 py-3 text-sm outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                      aria-label="Selecciona un país"
                    >
                      <option value="+34" selected>🇪🇸 +34</option>
                      <option value="+1">🇺🇸 +1</option>
                      <option value="+44">🇬🇧 +44</option>
                      <option value="+33">🇫🇷 +33</option>
                      <option value="+49">🇩🇪 +49</option>
                      <option value="+39">🇮🇹 +39</option>
                      <option value="+351">🇵🇹 +351</option>
                      <option value="+52">🇲🇽 +52</option>
                      <option value="+54">🇦🇷 +54</option>
                      <option value="+57">🇨🇴 +57</option>
                      <option value="+56">🇨🇱 +56</option>
                      <option value="+51">🇵🇪 +51</option>
                    </select>
                  </div>
                  <div>
                    <input
                      id="phoneLocal"
                      name="phoneLocal"
                      type="tel"
                      required
                      autocomplete="tel"
                      inputmode="numeric"
                      pattern="^[0-9]{6,15}$"
                      class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                      placeholder="Ej. 600123123"
                      aria-describedby="phoneHelp phoneError"
                    />
                    <p id="phoneHelp" class="mt-1 text-xs text-slate-500">Introduce solo el número local, sin prefijo.</p>
                    <p id="phoneError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
                  </div>
                </div>
                <input id="phone" name="phone" type="hidden" />
              </div>
              <div>
                <label for="email" class="mb-2 block text-sm font-semibold">Correo electrónico</label>
                <input
                  id="email"
                  name="email"
                  type="email"
                  required
                  pattern="^[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$"
                  autocomplete="email"
                  autocapitalize="none"
                  spellcheck="false"
                  aria-describedby="emailError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="nombre@correo.com"
                />
                <p id="emailError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
            </div>
          </section>

          <section class="step-panel max-h-0 overflow-hidden opacity-0 transition-all duration-300 ease-out" data-step-panel="2" aria-label="Paso 2: Dirección de entrega">
            <h2 class="mb-4 text-lg font-bold">Paso 2: Dirección de entrega</h2>
            <div class="space-y-4">
              <div>
                <label for="country" class="mb-2 block text-sm font-semibold">País</label>
                <input
                  id="country"
                  name="country"
                  type="text"
                  required
                  minlength="2"
                  pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$"
                  autocomplete="country-name"
                  aria-describedby="countryError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Ej. España"
                />
                <p id="countryError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label for="street" class="mb-2 block text-sm font-semibold">Dirección</label>
                <input
                  id="street"
                  name="street"
                  type="text"
                  required
                  minlength="8"
                  pattern="^(calle|avenida|av\.|plaza|paseo|pso\.|camino|ronda|travesía|travesia|trav\.|carretera|urbanización|urbanizacion|urb\.|vía|via)\s+.+\s+\d+[A-Za-z0-9ºª/-]*$"
                  autocomplete="street-address"
                  aria-describedby="streetError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Ej. Calle Mayor 45"
                />
                <p id="streetError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label for="floor" class="mb-2 block text-sm font-semibold">Piso</label>
                <input
                  id="floor"
                  name="floor"
                  type="text"
                  required
                  pattern="^\d+º?\s(?:[A-Za-z]+|\d+)$"
                  aria-describedby="floorError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Ej. 1º A o 2 C"
                />
                <p id="floorError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label for="zip" class="mb-2 block text-sm font-semibold">Código Postal</label>
                <input
                  id="zip"
                  name="zip"
                  type="number"
                  required
                  inputmode="numeric"
                  aria-describedby="zipError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition [appearance:textfield] focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                  placeholder="Ej. 28013"
                />
                <p id="zipError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label for="city" class="mb-2 block text-sm font-semibold">Provincia</label>
                <input
                  id="city"
                  name="city"
                  type="text"
                  required
                  minlength="2"
                  pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$"
                  autocomplete="address-level2"
                  aria-describedby="cityError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Ej. Madrid"
                />
                <p id="cityError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
            </div>
          </section>

          <section class="step-panel max-h-0 overflow-hidden opacity-0 transition-all duration-300 ease-out" data-step-panel="3" aria-label="Paso 3: Pago con tarjeta">
            <h2 class="mb-4 text-lg font-bold">Paso 3: Pago con tarjeta</h2>
            <div class="space-y-4">
              <div>
                <label for="cardNumber" class="mb-2 block text-sm font-semibold">Número de tarjeta</label>
                <input
                  id="cardNumber"
                  name="cardNumber"
                  type="text"
                  required
                  inputmode="numeric"
                  autocomplete="cc-number"
                  pattern="^(?:\d{4}\s){2,4}\d{4}$"
                  maxlength="24"
                  aria-describedby="cardNumberError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition [appearance:textfield] focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                  placeholder="Ej. 4242 4242 4242"
                />
                <p id="cardNumberError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div>
                <label for="cardName" class="mb-2 block text-sm font-semibold">Nombre del titular</label>
                <input
                  id="cardName"
                  name="cardName"
                  type="text"
                  required
                  autocomplete="cc-name"
                  minlength="5"
                  pattern="^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,}(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,})+$"
                  aria-describedby="cardNameError"
                  class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                  placeholder="Cómo aparece en la tarjeta"
                />
                <p id="cardNameError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
              </div>
              <div class="grid gap-4 sm:grid-cols-2">
                <div>
                  <label for="expiry" class="mb-2 block text-sm font-semibold">Fecha de caducidad (MM/AA)</label>
                  <input
                    id="expiry"
                    name="expiry"
                    type="text"
                    required
                    inputmode="numeric"
                    maxlength="5"
                    autocomplete="cc-exp"
                    pattern="^(0[1-9]|1[0-2])\/[0-9]{2}$"
                    aria-describedby="expiryError"
                    class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50"
                    placeholder="MM/AA"
                  />
                  <p id="expiryError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
                </div>
                <div>
                  <label for="ccv" class="mb-2 block text-sm font-semibold">CCV (3-4 dígitos)</label>
                  <input
                    id="ccv"
                    name="ccv"
                    type="text"
                    required
                    inputmode="numeric"
                    minlength="3"
                    maxlength="4"
                    pattern="^\d{3,4}$"
                    aria-describedby="ccvError"
                    class="w-full rounded-2xl border border-slate-300/80 bg-white/80 px-4 py-3 outline-none transition [appearance:textfield] focus:border-[#F8C8DC] focus:ring-2 focus:ring-[#F8C8DC]/50 [&::-webkit-inner-spin-button]:appearance-none [&::-webkit-outer-spin-button]:appearance-none"
                    placeholder="123"
                  />
                  <p id="ccvError" class="mt-1 hidden text-sm text-red-500" aria-live="polite"></p>
                </div>
              </div>
            </div>
          </section>

          <div class="flex items-center justify-between gap-3 pt-2">
            <button
              type="button"
              id="prevBtn"
              class="rounded-2xl border border-slate-300 bg-white px-4 py-3 text-sm font-bold text-slate-600 transition hover:border-[#F8C8DC] hover:bg-[#F8C8DC]/20 disabled:cursor-not-allowed disabled:opacity-45"
            >
              Anterior
            </button>
            <button
              type="button"
              id="nextBtn"
              class="rounded-2xl bg-[#F8C8DC] px-5 py-3 text-sm font-bold text-slate-700 shadow-sm transition hover:bg-[#f5bad2]"
            >
              Siguiente
            </button>
          </div>
        </form>
      </section>
    </main>

    <footer class="px-4 py-6 text-center text-xs text-slate-500">© 2026 Tu marca. Todos los derechos reservados.</footer>

    <script>
      const form = document.getElementById('paymentForm');
      const stepPanels = Array.from(document.querySelectorAll('[data-step-panel]'));
      const stepIndicators = Array.from(document.querySelectorAll('[data-step-indicator]'));
      const nextBtn = document.getElementById('nextBtn');
      const prevBtn = document.getElementById('prevBtn');
      const countryCodeSelect = document.getElementById('countryCode');
      const fullNameInput = document.getElementById('fullName');
      const phoneLocalInput = document.getElementById('phoneLocal');
      const phoneHiddenInput = document.getElementById('phone');
      const emailInput = document.getElementById('email');
      const countryInput = document.getElementById('country');
      const streetInput = document.getElementById('street');
      const floorInput = document.getElementById('floor');
      const zipInput = document.getElementById('zip');
      const cityInput = document.getElementById('city');
      const cardNumberInput = document.getElementById('cardNumber');
      const cardNameInput = document.getElementById('cardName');
      const expiryInput = document.getElementById('expiry');
      const ccvInput = document.getElementById('ccv');
      const fullNameError = document.getElementById('fullNameError');
      const phoneError = document.getElementById('phoneError');
      const emailError = document.getElementById('emailError');
      const countryError = document.getElementById('countryError');
      const streetError = document.getElementById('streetError');
      const floorError = document.getElementById('floorError');
      const zipError = document.getElementById('zipError');
      const cityError = document.getElementById('cityError');
      const cardNumberError = document.getElementById('cardNumberError');
      const cardNameError = document.getElementById('cardNameError');
      const expiryError = document.getElementById('expiryError');
      const ccvError = document.getElementById('ccvError');
      let currentStep = 1;
      let previousStep = 1;

      function buildFullPhone() {
        const selectedPrefix = countryCodeSelect.value;
        const localNumber = phoneLocalInput.value.trim();
        return selectedPrefix + localNumber;
      }

      function inputsForStep(step) {
        const panel = stepPanels.find((item) => Number(item.dataset.stepPanel) === step);
        return panel ? Array.from(panel.querySelectorAll('input')) : [];
      }

      function showFieldError(input, errorElement, message) {
        errorElement.textContent = message;
        errorElement.classList.remove('hidden');
        input.classList.add('border-red-400', 'focus:border-red-400', 'focus:ring-red-200');
        input.setAttribute('aria-invalid', 'true');
      }

      function clearFieldError(input, errorElement) {
        errorElement.textContent = '';
        errorElement.classList.add('hidden');
        input.classList.remove('border-red-400', 'focus:border-red-400', 'focus:ring-red-200');
        input.removeAttribute('aria-invalid');
      }

      function normalizeFullName(value) {
        return value
          .trim()
          .replace(/\s+/g, ' ')
          .split(' ')
          .filter(Boolean)
          .map((part) => part.charAt(0).toLocaleUpperCase('es-ES') + part.slice(1).toLocaleLowerCase('es-ES'))
          .join(' ');
      }

      function getEmailValidationResult(emailValue) {
        const normalizedEmail = emailValue.trim();
        const emailRegex = /^[a-z0-9._%+-]+@([a-z0-9-]+\.)+[a-z]{2,}$/;
        if (!emailRegex.test(normalizedEmail)) {
          return {
            valid: false,
            message: 'Ingresa un correo electrónico válido. Ejemplo: nombre@proveedor.com',
          };
        }

        const domain = normalizedEmail.split('@')[1];
        const typoDomains = new Set([
          'gma.co',
          'gma.com',
          'gmai.co',
          'gmai.com',
          'gmal.com',
          'gmali.co',
          'gmali.com',
          'gmial.com',
          'gmail.co',
          'hotnail.com',
          'outlok.com',
          'yaho.com',
        ]);

        const looksLikeGmailTypo =
          domain !== 'gmail.com' &&
          /^(gma|gmai|gmal|gmali|gmial|gmaill|gmail)\.(co|com)$/.test(domain);

        if (typoDomains.has(domain) || looksLikeGmailTypo) {
          return {
            valid: false,
            message: 'Ingresa un correo electrónico válido. Ejemplo: ejemplo@gmail.com',
          };
        }

        return {
          valid: true,
          message: '',
        };
      }

      function validateStepOneFields() {
        let isValid = true;
        let firstInvalidField = null;

        const normalizedName = normalizeFullName(fullNameInput.value);
        fullNameInput.value = normalizedName;
        const nameRegex = /^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ ]{2,}$/;
        const nameParts = normalizedName.split(' ').filter(Boolean);
        const hasNameAndTwoSurnames = nameParts.length >= 3;
        const allPartsHaveMinLength = nameParts.every((part) => part.length >= 2);

        if (!nameRegex.test(normalizedName) || normalizedName.length < 2 || !hasNameAndTwoSurnames || !allPartsHaveMinLength) {
          showFieldError(fullNameInput, fullNameError, 'Debes ingresar nombre y dos apellidos, usando solo letras y mínimo 2 caracteres por palabra');
          isValid = false;
          firstInvalidField = firstInvalidField || fullNameInput;
        }

        const localPhone = phoneLocalInput.value.trim();
        const mergedPhone = countryCodeSelect.value + localPhone;
        const phoneRegex = /^\+\d{6,19}$/;
        if (!phoneRegex.test(mergedPhone)) {
          showFieldError(phoneLocalInput, phoneError, "Formato de teléfono no válido. Usa solo números y el símbolo '+' si es necesario");
          isValid = false;
          firstInvalidField = firstInvalidField || phoneLocalInput;
        }

        const emailValidation = getEmailValidationResult(emailInput.value);
        if (!emailValidation.valid) {
          showFieldError(emailInput, emailError, emailValidation.message);
          isValid = false;
          firstInvalidField = firstInvalidField || emailInput;
        }

        if (firstInvalidField) {
          firstInvalidField.focus();
        }

        return isValid;
      }

      function validateStepTwoFields() {
        let isValid = true;
        let firstInvalidField = null;

        const countryValue = countryInput.value.trim();
        const countryRegex = /^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$/;
        if (!countryRegex.test(countryValue)) {
          showFieldError(countryInput, countryError, 'Ingrese un país válido. Ejemplo: España');
          isValid = false;
          firstInvalidField = firstInvalidField || countryInput;
        }

        const streetValue = streetInput.value.trim();
        const streetRegex = /^(calle|avenida|av\.|plaza|paseo|pso\.|camino|ronda|travesía|travesia|trav\.|carretera|urbanización|urbanizacion|urb\.|vía|via)\s+.+\s+\d+[A-Za-z0-9ºª/-]*$/i;
        if (!streetRegex.test(streetValue)) {
          showFieldError(streetInput, streetError, 'Ingrese una dirección válida. Ejemplo: Tipo de vía, nombre de la calle y número');
          isValid = false;
          firstInvalidField = firstInvalidField || streetInput;
        }

        const floorValue = floorInput.value.trim();
        const floorRegex = /^\d+º?\s(?:[A-Za-z]+|\d+)$/;
        if (!floorRegex.test(floorValue)) {
          showFieldError(floorInput, floorError, 'Ingrese un piso y una puerta válidos. Ejemplo: 1º A o 2 3');
          isValid = false;
          firstInvalidField = firstInvalidField || floorInput;
        }

        const zipValue = String(zipInput.value).trim();
        const zipRegex = /^\d{5,}$/;
        if (!zipRegex.test(zipValue)) {
          showFieldError(zipInput, zipError, 'Ingrese un código postal válido. Ejemplo: 28013, mínimo 5 caracteres.');
          isValid = false;
          firstInvalidField = firstInvalidField || zipInput;
        }

        const cityValue = cityInput.value.trim();
        const cityRegex = /^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]+)*$/;
        if (!cityRegex.test(cityValue)) {
          showFieldError(cityInput, cityError, 'Ingrese una ciudad válida.');
          isValid = false;
          firstInvalidField = firstInvalidField || cityInput;
        }

        if (firstInvalidField) {
          firstInvalidField.focus();
        }

        return isValid;
      }

      function validateStepThreeFields() {
        let isValid = true;
        let firstInvalidField = null;

        const cardValue = cardNumberInput.value.trim();
        const cardDigits = cardValue.replace(/\s/g, '');
        const cardRegex = /^(?:\d{4}\s){2,4}\d{4}$/;
        if (!cardRegex.test(cardValue) || cardDigits.length < 12) {
          showFieldError(cardNumberInput, cardNumberError, 'Número de tarjeta inválido. Mínimo 12 caracteres');
          isValid = false;
          firstInvalidField = firstInvalidField || cardNumberInput;
        }

        const cardNameValue = cardNameInput.value.trim().replace(/\s+/g, ' ');
        cardNameInput.value = cardNameValue;
        const cardNameRegex = /^[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,}(?:\s+[A-Za-zÁÉÍÓÚÜáéíóúüÑñ]{2,})+$/;
        if (!cardNameRegex.test(cardNameValue)) {
          showFieldError(cardNameInput, cardNameError, 'Ingrese nombre válido. Nombre y apellidos obligatorios');
          isValid = false;
          firstInvalidField = firstInvalidField || cardNameInput;
        }

        const expiryValue = expiryInput.value.trim();
        const expiryRegex = /^(0[1-9]|1[0-2])\/(0[1-9]|[1-9][0-9])$/;
        if (!expiryRegex.test(expiryValue)) {
          showFieldError(expiryInput, expiryError, 'Fecha inválida. Formato MM/AA con mes 01-12 y año 01-99');
          isValid = false;
          firstInvalidField = firstInvalidField || expiryInput;
        }

        const ccvValue = ccvInput.value.trim();
        const ccvRegex = /^\d{3,4}$/;
        if (!ccvRegex.test(ccvValue)) {
          showFieldError(ccvInput, ccvError, 'CCV inválido. Mínimo 3 dígitos');
          isValid = false;
          firstInvalidField = firstInvalidField || ccvInput;
        }

        if (firstInvalidField) {
          firstInvalidField.focus();
        }

        return isValid;
      }

      function clearStepThreeErrors() {
        clearFieldError(cardNumberInput, cardNumberError);
        clearFieldError(cardNameInput, cardNameError);
        clearFieldError(expiryInput, expiryError);
        clearFieldError(ccvInput, ccvError);
      }

      function validateCurrentStep() {
        if (currentStep === 1) {
          return validateStepOneFields();
        }

        if (currentStep === 2) {
          return validateStepTwoFields();
        }

        if (currentStep === 3) {
          return validateStepThreeFields();
        }

        const inputs = inputsForStep(currentStep);
        for (const input of inputs) {
          if (!input.checkValidity()) {
            input.reportValidity();
            return false;
          }
        }
        return true;
      }

      function updateStepUI(step) {
        if (step === 3 && previousStep !== 3) {
          clearStepThreeErrors();
        }

        stepPanels.forEach((panel) => {
          const panelStep = Number(panel.dataset.stepPanel);
          const isActive = panelStep === step;

          panel.classList.toggle('opacity-0', !isActive);
          panel.classList.toggle('max-h-0', !isActive);
          panel.classList.toggle('pointer-events-none', !isActive);
          panel.classList.toggle('opacity-100', isActive);
          panel.classList.toggle('max-h-[1200px]', isActive);
          panel.setAttribute('aria-hidden', String(!isActive));

          const focusableElements = panel.querySelectorAll('input, select, textarea, button, a[href]');
          focusableElements.forEach((element) => {
            if (isActive) {
              element.removeAttribute('tabindex');
            } else {
              element.setAttribute('tabindex', '-1');
            }
          });
        });

        stepIndicators.forEach((indicator) => {
          const indicatorStep = Number(indicator.dataset.stepIndicator);
          const dot = indicator.querySelector('.step-dot');
          const label = indicator.querySelector('p');
          const isPassed = indicatorStep <= step;
          const isCurrent = indicatorStep === step;

          dot.classList.toggle('bg-[#F8C8DC]', isPassed);
          dot.classList.toggle('border-[#F8C8DC]', isPassed);
          dot.classList.toggle('text-slate-700', isPassed);
          dot.classList.toggle('bg-white', !isPassed);
          dot.classList.toggle('border-slate-300', !isPassed);
          dot.classList.toggle('text-slate-400', !isPassed);
          dot.classList.toggle('scale-110', isCurrent);

          label.classList.toggle('text-slate-700', isPassed);
          label.classList.toggle('text-slate-400', !isPassed);
        });

        const isPrevInactive = step === 1;
        prevBtn.disabled = false;
        prevBtn.setAttribute('aria-disabled', String(isPrevInactive));
        prevBtn.classList.toggle('opacity-45', isPrevInactive);
        prevBtn.classList.toggle('cursor-not-allowed', isPrevInactive);
        nextBtn.textContent = step === 3 ? 'Confirmar pago' : 'Siguiente';
        nextBtn.type = step === 3 ? 'submit' : 'button';
        previousStep = step;
      }

      function goToNextStepIfValid() {
        if (currentStep === 3) {
          return;
        }

        if (!validateCurrentStep()) {
          return;
        }

        currentStep += 1;
        updateStepUI(currentStep);
      }

      nextBtn.addEventListener('click', () => {
        if (nextBtn.type === 'submit') {
          return;
        }

        goToNextStepIfValid();
      });

      form.addEventListener('keydown', (event) => {
        if (event.key !== 'Enter' || currentStep >= 3) {
          return;
        }

        const tagName = event.target.tagName;
        if (tagName === 'TEXTAREA' || tagName === 'BUTTON') {
          return;
        }

        event.preventDefault();
        goToNextStepIfValid();
      });

      prevBtn.addEventListener('click', () => {
        if (currentStep > 1) {
          currentStep -= 1;
          updateStepUI(currentStep);
        }
      });

      form.addEventListener('submit', (event) => {
        event.preventDefault();

        if (!validateStepOneFields()) {
          currentStep = 1;
          updateStepUI(currentStep);
          return;
        }

        if (!validateStepTwoFields()) {
          currentStep = 2;
          updateStepUI(currentStep);
          return;
        }

        if (!validateStepThreeFields()) {
          currentStep = 3;
          updateStepUI(currentStep);
          return;
        }

        phoneHiddenInput.value = buildFullPhone();

        if (!form.checkValidity()) {
          const firstInvalidInput = form.querySelector(':invalid');
          if (firstInvalidInput) {
            firstInvalidInput.reportValidity();
          }
          return;
        }

        alert('Pago enviado correctamente. Teléfono enviado: ' + phoneHiddenInput.value);
        form.reset();
        currentStep = 1;
        updateStepUI(currentStep);
      });

      fullNameInput.addEventListener('input', () => {
        clearFieldError(fullNameInput, fullNameError);
      });

      fullNameInput.addEventListener('blur', () => {
        fullNameInput.value = normalizeFullName(fullNameInput.value);
      });

      phoneLocalInput.addEventListener('input', () => {
        clearFieldError(phoneLocalInput, phoneError);
      });

      countryCodeSelect.addEventListener('change', () => {
        clearFieldError(phoneLocalInput, phoneError);
      });

      emailInput.addEventListener('input', () => {
        emailInput.value = emailInput.value.toLowerCase();
        clearFieldError(emailInput, emailError);
      });

      cardNumberInput.addEventListener('input', () => {
        const cardDigits = cardNumberInput.value.replace(/\D/g, '').slice(0, 20);
        const groupedDigits = cardDigits.match(/.{1,4}/g) || [];
        cardNumberInput.value = groupedDigits.join(' ');
        clearFieldError(cardNumberInput, cardNumberError);
      });

      cardNameInput.addEventListener('input', () => {
        clearFieldError(cardNameInput, cardNameError);
      });

      expiryInput.addEventListener('input', () => {
        let digits = expiryInput.value.replace(/\D/g, '').slice(0, 4);

        if (digits.length === 1) {
          const firstDigit = Number(digits);
          if (firstDigit >= 2) {
            digits = `0${digits}`;
          }
        }

        let month = digits.slice(0, 2);
        const year = digits.slice(2, 4);

        if (month.length === 2) {
          const monthNumber = Number(month);
          if (monthNumber === 0) {
            month = '01';
          } else if (monthNumber > 12) {
            month = '12';
          }
        }

        expiryInput.value = month + (month.length === 2 ? '/' : '') + year;
        clearFieldError(expiryInput, expiryError);
      });

      ccvInput.addEventListener('input', () => {
        ccvInput.value = ccvInput.value.replace(/\D/g, '').slice(0, 4);
        clearFieldError(ccvInput, ccvError);
      });

      countryInput.addEventListener('input', () => {
        clearFieldError(countryInput, countryError);
      });

      streetInput.addEventListener('input', () => {
        clearFieldError(streetInput, streetError);
      });

      floorInput.addEventListener('input', () => {
        clearFieldError(floorInput, floorError);
      });

      zipInput.addEventListener('input', () => {
        clearFieldError(zipInput, zipError);
      });

      cityInput.addEventListener('input', () => {
        clearFieldError(cityInput, cityError);
      });

      form.addEventListener('reset', () => {
        setTimeout(() => {
          countryCodeSelect.value = '+34';
          phoneHiddenInput.value = '';
          clearFieldError(fullNameInput, fullNameError);
          clearFieldError(phoneLocalInput, phoneError);
          clearFieldError(emailInput, emailError);
          clearFieldError(countryInput, countryError);
          clearFieldError(streetInput, streetError);
          clearFieldError(floorInput, floorError);
          clearFieldError(zipInput, zipError);
          clearFieldError(cityInput, cityError);
          clearFieldError(cardNumberInput, cardNumberError);
          clearFieldError(cardNameInput, cardNameError);
          clearFieldError(expiryInput, expiryError);
          clearFieldError(ccvInput, ccvError);
        }, 0);
      });

      updateStepUI(currentStep);
    </script>
  </body>
</html>
